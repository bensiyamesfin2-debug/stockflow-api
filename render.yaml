services:
  - type: web
    name: stockflow-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run prisma:generate
    startCommand: npm run start:cloud
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: stockflow-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: CLIENT_URLS
        value: https://stockflow-inventory-live.millereli620.chatgpt.site

databases:
  - name: stockflow-db
    plan: free
    databaseName: stockflow
    user: stockflow
